<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leosdarkroom</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #fff;
            --text: #111;
            --text-muted: #999;
            --text-light: #bbb;
            --text-lighter: #ccc;
            --text-lightest: #aaa;
            --border: #eee;
            --card-bg: #f2f2f2;
            --card-hover: #e8e8e8;
        }

        body.dark-mode {
            --bg: #000;
            --text: #fff;
            --text-muted: #888;
            --text-light: #666;
            --text-lighter: #555;
            --text-lightest: #777;
            --border: #1a1a1a;
            --card-bg: #0a0a0a;
            --card-hover: #151515;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 13px;
            font-weight: 400;
            transition: background-color 0.2s, color 0.2s;
        }

        header {
            padding: 28px 32px 20px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        @media (max-width: 480px) {
            header {
                padding: 20px 16px 16px;
            }
        }

        .site-name {
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.02em;
            color: var(--text);
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        nav a {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
            letter-spacing: 0.02em;
            transition: color 0.15s;
        }

        nav a:hover {
            color: var(--text);
        }

        .theme-toggle {
            font-size: 13px;
            color: var(--text-light);
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            margin: -8px;
            letter-spacing: 0.02em;
            transition: color 0.15s;
            font-family: inherit;
            line-height: 1;
        }

        .theme-toggle:hover {
            color: var(--text);
        }

        .filters {
            padding: 0 32px 24px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        @media (max-width: 480px) {
            .filters {
                padding: 0 16px 20px;
                gap: 12px;
            }
        }

        .f-btn {
            font-size: 12px;
            color: var(--text-light);
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            margin: -8px;
            letter-spacing: 0.02em;
            transition: color 0.15s;
            font-family: inherit;
        }

        @media (max-width: 480px) {
            .f-btn {
                padding: 10px;
                margin: -10px;
            }
        }

        .f-btn:hover {
            color: var(--text);
        }

        .f-btn.active {
            color: var(--text);
        }

        /* ── SECTIONS ── */
        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* ── GRID ──
     3 columns, left-to-right placement.
     grid-auto-rows is tiny (4px) so JS can set exact row spans.
     row-gap is 0 — gap is baked into each item's span calculation. */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 4px;
            column-gap: 20px;
            row-gap: 0;
            padding: 0 32px;
        }

        @media (max-width: 760px) {
            .photo-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .photo-grid {
                grid-template-columns: 1fr;
                padding: 0 16px;
            }
        }

        .grid-photo {
            cursor: zoom-in;
            overflow: hidden;
            background: var(--card-bg);
            opacity: 0;
            animation: fadein 0.25s forwards;
            /* Bottom margin provides the consistent gap between items */
            margin-bottom: 20px;
            border-radius: 10px;
        }

        .grid-photo img,
        .grid-photo canvas {
            display: block;
            width: 100%;
            height: auto;
            transition: transform 0.2s;
        }

        .grid-photo:hover img,
        .grid-photo:hover canvas {
            transform: scale(1.05);
        }

        @media (hover: none) {
            .grid-photo:hover img,
            .grid-photo:hover canvas {
                transform: none;
            }
        }

        /* ── ULTRAWIDE STRIP ── */
        .uw-strip {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 0 32px;
        }

        @media (max-width: 480px) {
            .uw-strip {
                padding: 0 16px;
                gap: 16px;
            }
        }

        .uw-item {
            cursor: zoom-in;
            overflow: hidden;
            background: var(--card-bg);
            opacity: 0;
            animation: fadein 0.25s forwards;
            border-radius: 10px;
        }

        .uw-item img,
        .uw-item canvas {
            display: block;
            width: 100%;
            height: auto;
            transition: transform 0.2s;
        }

        .uw-item:hover img,
        .uw-item:hover canvas {
            transform: scale(1.05);
        }

        @media (hover: none) {
            .uw-item:hover img,
            .uw-item:hover canvas {
                transform: none;
            }
        }

        @keyframes fadein {
            to {
                opacity: 1;
            }
        }

        @keyframes pulse {

            0%,
            100% {
                background-color: var(--card-bg);
            }

            50% {
                background-color: var(--card-hover);
            }
        }

        .grid-photo.loading,
        .uw-item.loading {
            animation: pulse 1.5s ease-in-out infinite !important;
            background-color: var(--card-bg) !important;
        }

        .grid-photo.loading img,
        .grid-photo.loading canvas,
        .uw-item.loading img,
        .uw-item.loading canvas {
            opacity: 0;
        }

        /* ── LIGHTBOX ── */
        .lb {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 999;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, background-color 0.2s, color 0.2s;
        }

        .lb.open {
            opacity: 1;
            pointer-events: all;
        }

        .lb-img-wrap {
            flex: 1;
            min-height: 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: default;
            transition: background-color 0.2s;
        }

        /* Fixed consistent box — every image lives inside this regardless of resolution.
     Landscape fills width, portrait fills height. Both constrained equally. */
        .lb-img-wrap img,
        .lb-img-wrap canvas {
            display: block;
            max-width: calc(100vw - 160px);
            max-height: calc(100vh - 44px - 48px);
            width: auto;
            height: auto;
            pointer-events: none;
            user-select: none;
            will-change: transform;
        }

        .lb-img-wrap.swiping img,
        .lb-img-wrap.swiping canvas {
            transition: none;
        }

        .lb-img-wrap.snap-back img,
        .lb-img-wrap.snap-back canvas {
            transition: transform 0.25s ease-out;
        }

        @media (max-width: 480px) {
            .lb-img-wrap img,
            .lb-img-wrap canvas {
                max-width: calc(100vw - 32px);
                max-height: calc(100vh - 60px - 32px);
            }
        }

        .lb-bar {
            width: 100%;
            height: 44px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            flex-shrink: 0;
            transition: background-color 0.2s, border-color 0.2s;
        }

        @media (max-width: 480px) {
            .lb-bar {
                height: 60px;
                padding: 0 16px;
            }
        }

        .lb-info {
            font-size: 11px;
            color: var(--text-lightest);
            letter-spacing: 0.03em;
            transition: color 0.2s;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 50%;
        }

        @media (max-width: 480px) {
            .lb-info {
                font-size: 10px;
                max-width: 45%;
                cursor: pointer;
            }

            .lb-info.expanded {
                white-space: normal;
                max-width: 100%;
                position: absolute;
                bottom: 70px;
                left: 16px;
                right: 16px;
                background: var(--bg);
                padding: 12px;
                border-radius: 8px;
                border: 1px solid var(--border);
                z-index: 10;
            }
        }

        .lb-btn {
            font-size: 11px;
            color: var(--text-lightest);
            background: none;
            border: none;
            cursor: pointer;
            padding: 12px;
            margin: -12px;
            font-family: inherit;
            letter-spacing: 0.03em;
            transition: color 0.2s;
        }

        .lb-btn:hover {
            color: var(--text);
        }

        .lb-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 20px;
            color: var(--text-lighter);
            font-size: 20px;
            line-height: 1;
            transition: color 0.2s;
            z-index: 1;
            user-select: none;
        }

        @media (max-width: 480px) {
            .lb-arrow {
                display: none;
            }
        }

        .lb-arrow:hover {
            color: var(--text);
        }

        .lb-arrow-left {
            left: 4px;
        }

        .lb-arrow-right {
            right: 4px;
        }

        footer {
            padding: 32px 32px 24px;
            margin-top: 32px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
        }

        @media (max-width: 480px) {
            footer {
                padding: 24px 16px 20px;
                margin-top: 24px;
            }
        }

        footer p {
            font-size: 11px;
            color: var(--text-lighter);
            letter-spacing: 0.03em;
        }
    </style>
</head>

        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            document.body.classList.add('dark-mode');
            updateThemeButtons('light');
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            const theme = isDark ? 'dark' : 'light';
            localStorage.setItem('theme', theme);
            updateThemeButtons(isDark ? 'light' : 'dark');
        }

        function updateThemeButtons(label) {
            themeToggle.textContent = label;
            lbThemeToggle.textContent = label;

        function rng(seed) {
            let s = seed;
            return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
        }

        function renderPlaceholder(canvas, w, h, seed) {
            const PW = w * 140, PH = h * 140;
            canvas.width = PW; canvas.height = PH;
            const ctx = canvas.getContext('2d');
            const r = rng(seed * 31337);
            const sceneType = Math.floor(r() * 5);
            const grad = ctx.createLinearGradient(0, 0, 0, PH);
            if (sceneType === 0) { grad.addColorStop(0, `hsl(0,0%,${82 + r() * 10}%)`); grad.addColorStop(0.4, `hsl(0,0%,${65 + r() * 12}%)`); grad.addColorStop(1, `hsl(0,0%,${25 + r() * 20}%)`); }
            else if (sceneType === 1) { grad.addColorStop(0, `hsl(0,0%,${8 + r() * 12}%)`); grad.addColorStop(0.5, `hsl(0,0%,${18 + r() * 20}%)`); grad.addColorStop(1, `hsl(0,0%,${35 + r() * 20}%)`); }
            else if (sceneType === 2) { grad.addColorStop(0, `hsl(0,0%,${88 + r() * 8}%)`); grad.addColorStop(0.35, `hsl(0,0%,${50 + r() * 18}%)`); grad.addColorStop(1, `hsl(0,0%,${5 + r() * 15}%)`); }
            else if (sceneType === 3) { grad.addColorStop(0, `hsl(0,0%,${58 + r() * 18}%)`); grad.addColorStop(1, `hsl(0,0%,${40 + r() * 18}%)`); }
            else { grad.addColorStop(0, `hsl(0,0%,${78 + r() * 18}%)`); grad.addColorStop(0.42, `hsl(0,0%,${88 + r() * 8}%)`); grad.addColorStop(0.58, `hsl(0,0%,${12 + r() * 14}%)`); grad.addColorStop(1, `hsl(0,0%,${4 + r() * 10}%)`); }
            ctx.fillStyle = grad; ctx.fillRect(0, 0, PW, PH);
            for (let i = 0; i < 4 + Math.floor(r() * 7); i++) {
                const type = r(); ctx.fillStyle = `hsl(0,0%,${5 + r() * 85}%)`; ctx.globalAlpha = 0.35 + r() * 0.55;
                if (type < 0.3) { ctx.fillRect(r() * PW, PH * 0.25 + r() * PH * 0.55, 8 + r() * PW * 0.22, 18 + r() * PH * 0.55); }
                else if (type < 0.5) { ctx.fillRect(0, PH * 0.3 + r() * PH * 0.45, PW, 1 + r() * 25); }
                else if (type < 0.68) { ctx.beginPath(); ctx.arc(r() * PW, r() * PH * 0.7, 4 + r() * 35, 0, Math.PI * 2); ctx.fill(); }
                else { ctx.fillRect(r() * PW, PH * 0.15 + r() * PH * 0.35, 1 + r() * 7, PH * 0.25 + r() * PH * 0.55); }
            }
            ctx.globalAlpha = 1;
            if (r() > 0.55) { const s = r() < 0.5 ? 0 : PW; const llG = ctx.createRadialGradient(s, PH * r() * 0.5, 0, s, PH * 0.5, PW * 0.9); llG.addColorStop(0, `hsla(0,0%,${80 + r() * 15}%,0.18)`); llG.addColorStop(1, 'hsla(0,0%,100%,0)'); ctx.fillStyle = llG; ctx.fillRect(0, 0, PW, PH); }
            const id = ctx.getImageData(0, 0, PW, PH); const d = id.data; const gr = rng(seed);
            for (let i = 0; i < d.length; i += 4) { const n = (gr() - 0.5) * 60; d[i] = Math.min(255, Math.max(0, d[i] + n)); d[i + 1] = Math.min(255, Math.max(0, d[i + 1] + n)); d[i + 2] = Math.min(255, Math.max(0, d[i + 2] + n)); }
            ctx.putImageData(id, 0, 0);
            const vig = ctx.createRadialGradient(PW / 2, PH / 2, PH * 0.2, PW / 2, PH / 2, PH * 0.9); vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,0.35)'); ctx.fillStyle = vig; ctx.fillRect(0, 0, PW, PH);
        }

        function renderUwide(canvas, seed) {
            const PW = 1300, PH = 480;
            canvas.width = PW; canvas.height = PH;
            const ctx = canvas.getContext('2d');
            const r = rng(seed * 31337);
            const sceneType = Math.floor(r() * 5);
            const grad = ctx.createLinearGradient(0, 0, PW, 0);
            if (sceneType === 0) { grad.addColorStop(0, `hsl(0,0%,${20 + r() * 15}%)`); grad.addColorStop(0.3, `hsl(0,0%,${60 + r() * 20}%)`); grad.addColorStop(0.7, `hsl(0,0%,${75 + r() * 15}%)`); grad.addColorStop(1, `hsl(0,0%,${30 + r() * 20}%)`); }
            else if (sceneType === 1) { grad.addColorStop(0, `hsl(0,0%,${5 + r() * 10}%)`); grad.addColorStop(0.5, `hsl(0,0%,${25 + r() * 20}%)`); grad.addColorStop(1, `hsl(0,0%,${10 + r() * 15}%)`); }
            else if (sceneType === 2) { grad.addColorStop(0, `hsl(0,0%,${80 + r() * 15}%)`); grad.addColorStop(0.4, `hsl(0,0%,${40 + r() * 20}%)`); grad.addColorStop(1, `hsl(0,0%,${85 + r() * 10}%)`); }
            else if (sceneType === 3) { grad.addColorStop(0, `hsl(0,0%,${55 + r() * 20}%)`); grad.addColorStop(1, `hsl(0,0%,${40 + r() * 20}%)`); }
            else { grad.addColorStop(0, `hsl(0,0%,${70 + r() * 20}%)`); grad.addColorStop(0.5, `hsl(0,0%,${88 + r() * 8}%)`); grad.addColorStop(1, `hsl(0,0%,${15 + r() * 20}%)`); }
            ctx.fillStyle = grad; ctx.fillRect(0, 0, PW, PH);
            const hy = PH * (0.4 + r() * 0.3);
            for (let i = 0; i < 4 + Math.floor(r() * 8); i++) {
                const type = r(); ctx.fillStyle = `hsl(0,0%,${5 + r() * 85}%)`; ctx.globalAlpha = 0.3 + r() * 0.5;
                if (type < 0.4) { ctx.fillRect(r() * PW, hy - r() * PH * 0.5, 4 + r() * PW * 0.06, r() * PH * 0.6); }
                else if (type < 0.7) { ctx.fillRect(0, hy + (r() - 0.5) * 40, PW, 1 + r() * 20); }
                else { ctx.beginPath(); ctx.arc(r() * PW, r() * PH, 5 + r() * 30, 0, Math.PI * 2); ctx.fill(); }
            }
            ctx.globalAlpha = 1;
            const vig = ctx.createRadialGradient(PW / 2, PH / 2, PH * 0.1, PW / 2, PH / 2, PW * 0.6); vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,0.4)'); ctx.fillStyle = vig; ctx.fillRect(0, 0, PW, PH);
        }

        function makeEl(photo, isUltrawide, forLightbox) {
            if (photo.src) {
                const img = document.createElement('img');
                img.src = photo.src;
                img.alt = photo.title;
                if (!forLightbox) img.loading = 'lazy';
                return img;
            }
            const c = document.createElement('canvas');
            if (isUltrawide) renderUwide(c, photo.seed);
            else renderPlaceholder(c, photo.w, photo.h, photo.seed);
            return c;
        }

        // ── Render sections and filter tabs ──
        const filterBar = document.getElementById('filterBar');
        const sectionsWrap = document.getElementById('sectionsWrap');

        function buildSection(sec) {
            const secEl = document.createElement('div');
            secEl.className = 'section' + (SECTIONS.indexOf(sec) === 0 ? ' active' : '');
            secEl.id = 'sec-' + sec.id;

            const isUw = sec.layout === 'ultrawide';
            const listEl = document.createElement('div');
            listEl.className = isUw ? 'uw-strip' : 'photo-grid';

            sec.photos.forEach((photo, pi) => {
                const item = document.createElement('div');
                item.className = isUw ? 'uw-item' : 'grid-photo';
                item.style.animationDelay = `${pi * 0.04}s`;
                const el = makeEl(photo, isUw, false);
                item.appendChild(el);

                // Add loading class for real images (not canvas placeholders)
                if (photo.src && el.tagName === 'IMG') {
                    item.classList.add('loading');
                    el.addEventListener('load', () => {
                        item.classList.remove('loading');
                    });
                }

                item.addEventListener('click', () => openLb(sec.id, pi));
                listEl.appendChild(item);
            });

            secEl.appendChild(listEl);
            return secEl;
        }

        SECTIONS.forEach((sec, si) => {
            const btn = document.createElement('button');
            btn.className = 'f-btn' + (si === 0 ? ' active' : '');
            btn.textContent = sec.label;
            btn.dataset.id = sec.id;
            filterBar.appendChild(btn);
            sectionsWrap.appendChild(buildSection(sec));
        });

        // ── Filter switching ──
        filterBar.addEventListener('click', e => {
            const btn = e.target.closest('.f-btn');
            if (!btn) return;
            document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('sec-' + btn.dataset.id).classList.add('active');
        });

        // ── Row-span masonry ──
        // grid-auto-rows: 4px, row-gap: 0. Each item uses margin-bottom: 20px for gap.
        // Span = ceil(imageHeight / 4) + ceil(20 / 4) to include the margin in the span.
        function spanItem(item) {
            const img = item.querySelector('img, canvas');
            if (!img) return;
            const colW = item.getBoundingClientRect().width;
            if (!colW) return;
            let h;
            if (img.tagName === 'CANVAS') {
                h = colW * (img.height / img.width);
            } else {
                if (!img.naturalWidth) return;
                h = colW * (img.naturalHeight / img.naturalWidth);
            }
            // Each row unit is 4px. We need to span enough rows to cover image + 20px margin.
            item.style.gridRowEnd = `span ${Math.ceil((h + 20) / 4)}`;
        }

        function spanAll() {
            document.querySelectorAll('.photo-grid .grid-photo').forEach(spanItem);
        }

        window.addEventListener('load', spanAll);
        window.addEventListener('resize', spanAll);
        document.addEventListener('load', e => {
            if (e.target.tagName === 'IMG') {
                const item = e.target.closest('.grid-photo');
                if (item) spanItem(item);
            }
        }, true);
        setTimeout(spanAll, 50);

        // ── Lightbox ──
        const lb = document.getElementById('lb');
        const lbImgWrap = document.getElementById('lbImgWrap');
        const lbInfo = document.getElementById('lbInfo');
        let lbSecId = null;
        let lbIndex = 0;

        function currentSec() { return SECTIONS.find(s => s.id === lbSecId); }

        function openLb(secId, index) {
            lbSecId = secId;
            lbIndex = index;
            drawLb();
            lb.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function drawLb(slideFrom = null) {
            const sec = currentSec();
            const photo = sec.photos[lbIndex];
            const isUw = sec.layout === 'ultrawide';
            // Remove old image, keep arrow buttons
            lbImgWrap.querySelectorAll('img, canvas').forEach(el => el.remove());
            // Insert image before arrows so it sits behind them in stacking
            const el = makeEl(photo, isUw, true);

            // If sliding in from a direction, set initial position
            if (slideFrom === 'left') {
                el.style.transform = 'translateX(-30%)';
                el.style.opacity = '0';
            } else if (slideFrom === 'right') {
                el.style.transform = 'translateX(30%)';
                el.style.opacity = '0';
            }

            lbImgWrap.insertBefore(el, lbImgWrap.firstChild);

            // Animate in if sliding
            if (slideFrom) {
                requestAnimationFrame(() => {
                    el.style.transition = 'transform 0.25s ease-out, opacity 0.25s ease-out';
                    el.style.transform = '';
                    el.style.opacity = '';
                    setTimeout(() => {
                        el.style.transition = '';
                    }, 250);
                });
            }

            const meta = [photo.camera, photo.lens, photo.film].filter(Boolean).join(' · ');
            const counter = `${lbIndex + 1} / ${sec.photos.length}`;
            lbInfo.textContent = meta
                ? `${photo.title} — ${meta}   ${counter}`
                : `${photo.title}   ${counter}`;
            // Collapse expanded info when changing images
            lbInfo.classList.remove('expanded');
        }

        function closeLb() {
            lb.classList.remove('open');
            document.body.style.overflow = '';
            // Collapse expanded info when closing
            lbInfo.classList.remove('expanded');
        }

        function lbNav(dir, animate = false) {
            const sec = currentSec();
            lbIndex = (lbIndex + dir + sec.photos.length) % sec.photos.length;
            // When animating, slide from opposite direction of movement
            const slideFrom = animate ? (dir > 0 ? 'right' : 'left') : null;
            drawLb(slideFrom);
        }

        document.getElementById('lbClose').addEventListener('click', e => { e.stopPropagation(); closeLb(); });
        document.getElementById('lbPrev').addEventListener('click', e => { e.stopPropagation(); lbNav(-1, true); });
        document.getElementById('lbNext').addEventListener('click', e => { e.stopPropagation(); lbNav(1, true); });

        // Toggle info text expansion on mobile
        lbInfo.addEventListener('click', e => {
            if (window.innerWidth <= 480) {
                e.stopPropagation();
                lbInfo.classList.toggle('expanded');
            }
        });

        // Click anywhere in the wrap that isn't an arrow closes the lightbox
        lbImgWrap.addEventListener('click', e => {
            if (!e.target.closest('.lb-arrow')) closeLb();
        });

        document.addEventListener('keydown', e => {
            if (!lb.classList.contains('open')) return;
            if (e.key === 'Escape') closeLb();
            if (e.key === 'ArrowLeft') lbNav(-1, true);
            if (e.key === 'ArrowRight') lbNav(1, true);
        });

        // ── Swipe gestures for mobile ──
        let touchStartX = 0;
        let touchStartY = 0;
        let touchCurrentX = 0;
        let isSwiping = false;
        const swipeThreshold = 80;

        lbImgWrap.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
            touchCurrentX = touchStartX;
            isSwiping = false;
            lbImgWrap.classList.remove('snap-back');
        }, { passive: true });

        lbImgWrap.addEventListener('touchmove', e => {
            const currentX = e.changedTouches[0].screenX;
            const currentY = e.changedTouches[0].screenY;
            const diffX = currentX - touchStartX;
            const diffY = currentY - touchStartY;

            // Only start swiping if horizontal movement is dominant
            if (!isSwiping && Math.abs(diffX) > 10) {
                if (Math.abs(diffX) > Math.abs(diffY)) {
                    isSwiping = true;
                    lbImgWrap.classList.add('swiping');
                }
            }

            if (isSwiping) {
                touchCurrentX = currentX;
                const img = lbImgWrap.querySelector('img, canvas');
                if (img) {
                    // Apply transform with resistance at edges
                    const resistance = 0.4;
                    const translateX = diffX * resistance;
                    img.style.transform = `translateX(${translateX}px)`;
                }
            }
        }, { passive: true });

        lbImgWrap.addEventListener('touchend', e => {
            const diffX = touchCurrentX - touchStartX;
            const img = lbImgWrap.querySelector('img, canvas');

            lbImgWrap.classList.remove('swiping');

            if (isSwiping && Math.abs(diffX) > swipeThreshold) {
                // Complete the swipe - slide out and navigate
                if (img) {
                    const direction = diffX > 0 ? 1 : -1;
                    img.style.transition = 'transform 0.2s ease-out, opacity 0.2s ease-out';
                    img.style.transform = `translateX(${direction * window.innerWidth * 0.5}px)`;
                    img.style.opacity = '0';

                    setTimeout(() => {
                        if (diffX > 0) {
                            lbNav(-1, true); // Swipe right - previous
                        } else {
                            lbNav(1, true);  // Swipe left - next
                        }
                    }, 200);
                }
            } else if (isSwiping && img) {
                // Snap back - didn't swipe far enough
                lbImgWrap.classList.add('snap-back');
                img.style.transform = '';
                setTimeout(() => {
                    lbImgWrap.classList.remove('snap-back');
                }, 250);
            }

            isSwiping = false;
        }, { passive: true });
    </script>
</body>

</html>
