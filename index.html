<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" id="themeColorLight">
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" id="themeColorDark">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>leosdarkroom</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg: #fff;
            --text: #111;
            --text-muted: #999;
            --text-light: #bbb;
            --text-lighter: #ccc;
            --text-lightest: #aaa;
            --border: #eee;
            --card-bg: #f2f2f2;
            --card-hover: #e8e8e8;
        }

        body.dark-mode {
            --bg: #000;
            --text: #fff;
            --text-muted: #888;
            --text-light: #666;
            --text-lighter: #555;
            --text-lightest: #777;
            --border: #1a1a1a;
            --card-bg: #0a0a0a;
            --card-hover: #151515;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 13px;
            font-weight: 400;
            transition: background-color 0.2s, color 0.2s;
        }

        header {
            padding: 28px 32px 20px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        @media (max-width: 480px) {
            header {
                padding: 20px 16px 16px;
            }
        }

        .site-name {
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.02em;
            color: var(--text);
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 24px;
            align-items: center;
        }

        nav a {
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
            letter-spacing: 0.02em;
            transition: color 0.15s;
        }

        nav a:hover {
            color: var(--text);
        }

        .theme-toggle {
            font-size: 13px;
            color: var(--text-light);
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            margin: -8px;
            letter-spacing: 0.02em;
            transition: color 0.15s;
            font-family: inherit;
            line-height: 1;
        }

        .theme-toggle:hover {
            color: var(--text);
        }

        .filters {
            padding: 0 32px 24px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        @media (max-width: 480px) {
            .filters {
                padding: 0 16px 20px;
                gap: 12px;
            }
        }

        .f-btn {
            font-size: 12px;
            color: var(--text-light);
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            margin: -8px;
            letter-spacing: 0.02em;
            transition: color 0.15s;
            font-family: inherit;
        }

        @media (max-width: 480px) {
            .f-btn {
                padding: 10px;
                margin: -10px;
            }
        }

        .f-btn:hover {
            color: var(--text);
        }

        .f-btn.active {
            color: var(--text);
        }

        /* ── SECTIONS ── */
        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* ── GRID ──
     3 columns, left-to-right placement.
     grid-auto-rows is tiny (4px) so JS can set exact row spans.
     row-gap is 0 — gap is baked into each item's span calculation. */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 4px;
            column-gap: 20px;
            row-gap: 0;
            padding: 0 32px;
        }

        @media (max-width: 760px) {
            .photo-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .photo-grid {
                grid-template-columns: 1fr;
                padding: 0 16px;
            }
        }

        .grid-photo {
            cursor: zoom-in;
            overflow: hidden;
            background: var(--card-bg);
            opacity: 0;
            animation: fadein 0.25s forwards;
            /* Bottom margin provides the consistent gap between items */
            margin-bottom: 20px;
            border-radius: 10px;
            line-height: 0;
            height: fit-content;
        }

        .grid-photo img {
            display: block;
            width: 100%;
            height: auto;
            transition: transform 0.2s;
            vertical-align: bottom;
        }

        .grid-photo:hover img {
            transform: scale(1.05);
        }

        @media (hover: none) {
            .grid-photo:hover img {
                transform: none;
            }
        }

        /* ── ULTRAWIDE STRIP ── */
        .uw-strip {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 0 32px;
        }

        @media (max-width: 480px) {
            .uw-strip {
                padding: 0 16px;
                gap: 16px;
            }
        }

        .uw-item {
            cursor: zoom-in;
            overflow: hidden;
            background: var(--card-bg);
            opacity: 0;
            animation: fadein 0.25s forwards;
            border-radius: 10px;
            line-height: 0;
            height: fit-content;
        }

        .uw-item img {
            display: block;
            width: 100%;
            height: auto;
            transition: transform 0.2s;
            vertical-align: bottom;
        }

        .uw-item:hover img {
            transform: scale(1.05);
        }

        @media (hover: none) {
            .uw-item:hover img {
                transform: none;
            }
        }

        @keyframes fadein {
            to {
                opacity: 1;
            }
        }

        @keyframes pulse {

            0%,
            100% {
                background-color: var(--card-bg);
            }

            50% {
                background-color: var(--card-hover);
            }
        }

        .placeholder {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 10px;
            filter: blur(10px);
            transform: scale(1.05);
        }

        /* When placeholder and image coexist, stack them */
        .grid-photo,
        .uw-item {
            position: relative;
        }

        /* When both exist, image overlays placeholder */
        .grid-photo .placeholder+img,
        .uw-item .placeholder+img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: auto;
        }

        /* ── LIGHTBOX ── */
        .lb {
            position: fixed;
            inset: 0;
            background: var(--bg);
            z-index: 999;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s, background-color 0.2s, color 0.2s;
        }

        .lb.open {
            opacity: 1;
            pointer-events: all;
        }

        .lb-img-wrap {
            flex: 1;
            min-height: 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: default;
            transition: background-color 0.2s;
            touch-action: none;
            -ms-touch-action: none;
            /* Firefox needs overflow hidden for touch transforms */
            overflow: hidden;
        }

        .lb-placeholder {
            display: block;
            max-width: calc(100vw - 160px);
            max-height: calc(100vh - 44px - 48px);
            width: auto;
            height: auto;
            border-radius: 10px;
            filter: blur(20px);
            transform: scale(1.1);
        }

        @media (max-width: 480px) {
            .lb-placeholder {
                max-width: calc(100vw - 32px);
                max-height: calc(100vh - 60px - 32px);
            }
        }

        /* Fixed consistent box — every image lives inside this regardless of resolution.
     Landscape fills width, portrait fills height. Both constrained equally. */
        .lb-img-wrap img {
            display: block;
            max-width: calc(100vw - 160px);
            max-height: calc(100vh - 44px - 48px - 60px);
            width: auto;
            height: auto;
            pointer-events: none;
            user-select: none;
            -moz-user-select: none;
            -webkit-user-select: none;
            will-change: transform;
            /* Firefox needs explicit GPU layer for touch transforms */
            transform: translate3d(0, 0, 0);
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
        }

        .lb-img-wrap.swiping img {
            transition: none !important;
        }

        .lb-img-wrap.snap-back img {
            transition: transform 0.25s ease-out !important;
        }

        @media (max-width: 480px) {
            .lb-img-wrap img {
                max-width: calc(100vw - 32px);
                max-height: calc(100vh - 60px - 32px - 40px);
            }
        }

        .lb-bar {
            width: 100%;
            height: 44px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            flex-shrink: 0;
            transition: background-color 0.2s, border-color 0.2s;
        }

        @media (max-width: 480px) {
            .lb-bar {
                height: 60px;
                padding: 0 16px;
            }
        }

        .lb-info {
            font-size: 11px;
            color: var(--text-lightest);
            letter-spacing: 0.03em;
            transition: color 0.2s;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            max-width: 50%;
            user-select: none;
        }

        @media (max-width: 1024px) {
            .lb-info {
                font-size: 10px;
                max-width: 45%;
                cursor: pointer;
            }

            .lb-info.expanded {
                white-space: normal;
                max-width: 100%;
                position: absolute;
                bottom: 70px;
                left: 16px;
                right: 16px;
                background: var(--bg);
                padding: 12px;
                border-radius: 8px;
                border: 1px solid var(--border);
                z-index: 10;
            }
        }

        .lb-btn {
            font-size: 11px;
            color: var(--text-lightest);
            background: none;
            border: none;
            cursor: pointer;
            padding: 12px;
            margin: -12px;
            font-family: inherit;
            letter-spacing: 0.03em;
            transition: color 0.2s;
            text-decoration: none;
        }

        .lb-btn:hover {
            color: var(--text);
        }

        .lb-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 20px;
            color: var(--text-lighter);
            font-size: 20px;
            line-height: 1;
            transition: color 0.2s;
            z-index: 1;
            user-select: none;
        }

        @media (max-width: 480px) {
            .lb-arrow {
                display: none;
            }
        }

        .lb-arrow:hover {
            color: var(--text);
        }

        .lb-arrow-left {
            left: 4px;
        }

        .lb-arrow-right {
            right: 4px;
        }

        footer {
            padding: 32px 32px 24px;
            margin-top: 32px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
        }

        @media (max-width: 480px) {
            footer {
                padding: 24px 16px 20px;
                margin-top: 24px;
            }
        }

        footer p {
            font-size: 11px;
            color: var(--text-lighter);
            letter-spacing: 0.03em;
        }
    </style>
</head>

<body>

    <header>
        <a class="site-name" href="#">leosdarkroom</a>
        <nav>
            <button class="theme-toggle" id="themeToggle">dark</button>
        </nav>
    </header>

    <div class="filters" id="filterBar"></div>
    <div id="sectionsWrap"></div>

    <div class="lb" id="lb">
        <div class="lb-img-wrap" id="lbImgWrap">
            <button class="lb-arrow lb-arrow-left" id="lbPrev">&#8592;</button>
            <button class="lb-arrow lb-arrow-right" id="lbNext">&#8594;</button>
        </div>
        <div class="lb-bar">
            <span class="lb-info" id="lbInfo"></span>
            <div style="display: flex; gap: 24px;">
                <a class="lb-btn" id="lbFullRes" href="#" target="_blank">full resolution</a>
                <button class="lb-btn theme-toggle" id="lbThemeToggle">dark</button>
            </div>
        </div>
    </div>

    <footer>
        <p>leo ashcroft</p>
        <p>auckland, nz</p>
    </footer>

    <script>
        // ============================================================
        //  DARK MODE
        // ============================================================

        const themeToggle = document.getElementById('themeToggle');
        const lbThemeToggle = document.getElementById('lbThemeToggle');
        const themeColorLight = document.getElementById('themeColorLight');
        const themeColorDark = document.getElementById('themeColorDark');

        function updateThemeColor(isDark) {
            const color = isDark ? '#000000' : '#ffffff';
            // Update both meta tags to override system preference
            themeColorLight.setAttribute('content', color);
            themeColorDark.setAttribute('content', color);
        }

        // Check for saved theme preference or default to light mode
        const currentTheme = localStorage.getItem('theme') || 'light';
        if (currentTheme === 'dark') {
            document.body.classList.add('dark-mode');
            updateThemeButtons('light');
            updateThemeColor(true);
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDark = document.body.classList.contains('dark-mode');
            const theme = isDark ? 'dark' : 'light';
            localStorage.setItem('theme', theme);
            updateThemeButtons(isDark ? 'light' : 'dark');
            updateThemeColor(isDark);
        }

        function updateThemeButtons(label) {
            themeToggle.textContent = label;
            lbThemeToggle.textContent = label;
        }

        themeToggle.addEventListener('click', toggleTheme);
        lbThemeToggle.addEventListener('click', toggleTheme);

        // ============================================================
        //  PORTFOLIO CONFIG — edit this to customise your portfolio
        //
        //  IMAGE FOLDER STRUCTURE:
        //    images/full/        - Original high-resolution images
        //    images/compressed/  - Optimized web versions (auto-generated)
        //    images/placeholders/ - Tiny blurry previews (auto-generated)
        //
        //  HOW TO ADD YOUR OWN IMAGES:
        //  1. Put your original image files in images/full/
        //  2. Run: npm run build-images (generates compressed + placeholders)
        //  3. Add the filename to your section below
        //
        //  HOW TO ADD A NEW SECTION:
        //  Copy one of the section objects below and add it to the
        //  SECTIONS array. Set  layout: 'grid'  for normal photos,
        //  or  layout: 'ultrawide'  for 65:24 panoramic images.
        //
        //  PHOTO FIELDS (all optional except src and title):
        //    src:    filename (e.g. 'my-photo.jpg')
        //    title:  caption shown in lightbox
        //    film:   film stock — omit if shooting digital
        //    camera: camera body — omit to hide
        //    lens:   lens used — omit to hide
        // ============================================================

        // Image paths configuration
        const IMAGE_PATHS = {
            compressed: 'images/compressed/',
            placeholders: 'images/placeholders/',
            full: 'images/full/'
        };

        // Helper to get image paths
        function getImagePaths(filename, folder) {
            // Convert filename to webp for compressed/placeholder versions
            const baseName = filename.replace(/\.[^.]+$/, '');
            return {
                compressed: IMAGE_PATHS.compressed + folder + '/' + baseName + '.webp',
                placeholder: IMAGE_PATHS.placeholders + folder + '/' + baseName + '.webp',
                full: IMAGE_PATHS.full + folder + '/' + filename
            };
        }

        const SECTIONS = [

                    { src: 'IMG_8599.JPG', title: 'ngunguru', film: 'Kodak Ultramax 400', camera: 'Canon 1000f', lens: 'Canon EF 28-70mm' },

                    { src: 'LeoAshcroft1372--0019_16A.jpeg', title: 'flowing tide', film: 'Kodak Ultramax 400', camera: 'Canon New F-1', lens: 'Canon FD 50mm f/1.4 S.S.C' },
                    { src: 'LeoAshcroft5609--0014_12.jpg', title: 'waitakere adventure', film: 'Ilford hp5+', camera: 'Voigtlander Vito B' },

            },
            {
                id: 'ultrawide',
                label: 'ultrawide',
                layout: 'ultrawide',
                photos: [
                    { src: 'P1054011.JPEG', title: '', film: '', camera: 'Canon New F-1', lens: 'Canon FD 50mm f/1.4 S.S.C' },
                ]
            },

        // ============================================================
        //  END OF CONFIG — no need to edit below this line
        // ============================================================

        function makeEl(photo, folder) {
            const paths = getImagePaths(photo.src, folder);
            const img = document.createElement('img');
            // Always use compressed images
            img.src = paths.compressed;
            img.alt = photo.title;
            img.dataset.placeholder = paths.placeholder;
            return img;
        }

        // No preloading or upgrading needed - using compressed images only

        // ── Render sections and filter tabs ──
        const filterBar = document.getElementById('filterBar');
        const sectionsWrap = document.getElementById('sectionsWrap');

        // No image observer needed - using compressed images only

        function buildSection(sec) {
            const secEl = document.createElement('div');
            secEl.className = 'section' + (SECTIONS.indexOf(sec) === 0 ? ' active' : '');
            secEl.id = 'sec-' + sec.id;

            const isUw = sec.layout === 'ultrawide';
            const listEl = document.createElement('div');
            listEl.className = isUw ? 'uw-strip' : 'photo-grid';

            sec.photos.forEach((photo, pi) => {
                const item = document.createElement('div');
                item.className = isUw ? 'uw-item' : 'grid-photo';
                item.style.animationDelay = `${pi * 0.04}s`;
                const el = makeEl(photo, sec.label);

                item.appendChild(el);

                // Check if already loaded (cached) - if so, no placeholder needed
                if (el.complete && el.naturalWidth > 0) {
                    // Already loaded, just show it
                } else {
                    // Create placeholder using tiny blurry image
                    const placeholder = document.createElement('img');
                    placeholder.className = 'placeholder';
                    placeholder.src = el.dataset.placeholder;
                    placeholder.alt = '';
                    placeholder.draggable = false;
                    item.insertBefore(placeholder, el);

                    // Hide main image until loaded
                    el.style.opacity = '0';
                    el.style.transition = 'opacity 0.3s ease, transform 0.2s';

                    const showImage = () => {
                        el.style.opacity = '1';
                        setTimeout(() => {
                            placeholder.remove();
                            el.style.transition = '';
                            spanItem(item);
                        }, 300);
                    };

                    el.addEventListener('load', showImage, { once: true });
                    el.addEventListener('error', () => {
                        placeholder.remove();
                    }, { once: true });
                }

                item.addEventListener('click', () => openLb(sec.id, pi));
                listEl.appendChild(item);
            });

            secEl.appendChild(listEl);
            return secEl;
        }

        SECTIONS.forEach((sec, si) => {
            const btn = document.createElement('button');
            btn.className = 'f-btn' + (si === 0 ? ' active' : '');
            btn.textContent = sec.label;
            btn.dataset.id = sec.id;
            filterBar.appendChild(btn);
            sectionsWrap.appendChild(buildSection(sec));
        });

        // No preloading needed - using compressed images only

        // ── Filter switching ──
        filterBar.addEventListener('click', e => {
            const btn = e.target.closest('.f-btn');
            if (!btn) return;

            document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            btn.classList.add('active');
            const activeSection = document.getElementById('sec-' + btn.dataset.id);
            activeSection.classList.add('active');
        });

        // ── Row-span masonry ──
        // grid-auto-rows: 4px, row-gap: 0. Each item uses margin-bottom: 20px for gap.
        // Span = ceil(imageHeight / 4) + ceil(20 / 4) to include the margin in the span.
        function spanItem(item) {
            const img = item.querySelector('img');
            if (!img || !img.naturalWidth) return;
            const colW = item.getBoundingClientRect().width;
            if (!colW) return;
            const h = colW * (img.naturalHeight / img.naturalWidth);
            // Each row unit is 4px. We need to span enough rows to cover image + 20px margin.
            item.style.gridRowEnd = `span ${Math.ceil((h + 20) / 4)}`;
        }

        function spanAll() {
            document.querySelectorAll('.photo-grid .grid-photo').forEach(spanItem);
        }

        window.addEventListener('load', spanAll);
        window.addEventListener('resize', spanAll);
        document.addEventListener('load', e => {
            if (e.target.tagName === 'IMG') {
                const item = e.target.closest('.grid-photo');
                if (item) spanItem(item);
            }
        }, true);
        setTimeout(spanAll, 50);

        // ── Lightbox ──
        const lb = document.getElementById('lb');
        const lbImgWrap = document.getElementById('lbImgWrap');
        const lbInfo = document.getElementById('lbInfo');
        const lbFullRes = document.getElementById('lbFullRes');
        let lbSecId = null;
        let lbIndex = 0;

        function currentSec() { return SECTIONS.find(s => s.id === lbSecId); }

        function openLb(secId, index) {
            lbSecId = secId;
            lbIndex = index;
            drawLb();
            lb.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function drawLb(slideFrom = null) {
            const sec = currentSec();
            const photo = sec.photos[lbIndex];
            // Remove old image, keep arrow buttons
            lbImgWrap.querySelectorAll('img').forEach(el => el.remove());
            // Insert image before arrows so it sits behind them in stacking
            const el = makeEl(photo, sec.label);

            // Set up transitions - no fade for initial open, only for navigation
            if (!slideFrom) {
                el.style.transition = '';
                el.style.opacity = '1';
            } else {
                el.style.transition = 'transform 0.25s ease-out, opacity 0.25s ease-out';
                if (slideFrom === 'left') {
                    el.style.transform = 'translate3d(-30%, 0, 0)';
                    el.style.opacity = '0';
                } else if (slideFrom === 'right') {
                    el.style.transform = 'translate3d(30%, 0, 0)';
                    el.style.opacity = '0';
                }
            }

            lbImgWrap.insertBefore(el, lbImgWrap.firstChild);

            // Animate in if sliding
            if (slideFrom) {
                requestAnimationFrame(() => {
                    el.style.transform = 'translate3d(0, 0, 0)';
                    el.style.opacity = '1';
                    setTimeout(() => {
                        el.style.transition = '';
                    }, 250);
                });
            }

            const meta = [photo.camera, photo.lens, photo.film].filter(Boolean).join(' · ');
            lbInfo.textContent = meta
                ? `${photo.title} — ${meta}`
                : photo.title;

            // Update full resolution link
            const paths = getImagePaths(photo.src, sec.label);
            lbFullRes.href = paths.full;

            // Collapse expanded info when changing images
            lbInfo.classList.remove('expanded');
        }

        function closeLb() {
            // Scroll to the photo that was being viewed
            const secEl = document.getElementById('sec-' + lbSecId);
            if (secEl) {
                const items = secEl.querySelectorAll('.grid-photo, .uw-item');
                if (items[lbIndex]) {
                    items[lbIndex].scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }

            lb.classList.remove('open');
            document.body.style.overflow = '';
            // Collapse expanded info when closing
            lbInfo.classList.remove('expanded');
        }

        function lbNav(dir, animate = false) {
            const sec = currentSec();
            lbIndex = (lbIndex + dir + sec.photos.length) % sec.photos.length;
            // When animating, slide from opposite direction of movement
            const slideFrom = animate ? (dir > 0 ? 'right' : 'left') : null;
            drawLb(slideFrom);
        }

        document.getElementById('lbPrev').addEventListener('click', e => { e.stopPropagation(); lbNav(-1, true); });
        document.getElementById('lbNext').addEventListener('click', e => { e.stopPropagation(); lbNav(1, true); });

        // Toggle info text expansion on mobile/tablet
        lbInfo.addEventListener('click', e => {
            if (window.innerWidth <= 1024) {
                e.stopPropagation();
                lbInfo.classList.toggle('expanded');
            }
        });

        // Click anywhere in the wrap that isn't an arrow closes the lightbox
        lbImgWrap.addEventListener('click', e => {
            if (!e.target.closest('.lb-arrow')) closeLb();
        });

        document.addEventListener('keydown', e => {
            if (!lb.classList.contains('open')) return;
            if (e.key === 'Escape') closeLb();
            if (e.key === 'ArrowLeft') lbNav(-1, true);
            if (e.key === 'ArrowRight') lbNav(1, true);
        });

        // ── Swipe gestures for mobile ──
        let touchStartX = 0;
        let touchStartY = 0;
        let touchCurrentX = 0;
        let isSwiping = false;
        const swipeThreshold = 80;

        lbImgWrap.addEventListener('touchstart', e => {
            touchStartX = e.changedTouches[0].clientX;
            touchStartY = e.changedTouches[0].clientY;
            touchCurrentX = touchStartX;
            isSwiping = false;
            lbImgWrap.classList.remove('snap-back');
            // Reset transform for Firefox - ensures GPU layer is ready
            const img = lbImgWrap.querySelector('img');
            if (img) {
                img.style.transform = 'translate3d(0, 0, 0)';
            }
        }, { passive: true });

        lbImgWrap.addEventListener('touchmove', e => {
            const currentX = e.changedTouches[0].clientX;
            const currentY = e.changedTouches[0].clientY;
            const diffX = currentX - touchStartX;
            const diffY = currentY - touchStartY;

            // Only start swiping if horizontal movement is dominant
            if (!isSwiping && Math.abs(diffX) > 10) {
                if (Math.abs(diffX) > Math.abs(diffY)) {
                    isSwiping = true;
                    lbImgWrap.classList.add('swiping');
                }
            }

            if (isSwiping) {
                touchCurrentX = currentX;
                const img = lbImgWrap.querySelector('img');
                if (img) {
                    // Apply transform with resistance at edges
                    const resistance = 0.4;
                    const translateX = diffX * resistance;
                    // Use translate3d for Firefox compatibility
                    img.style.transform = `translate3d(${translateX}px, 0, 0)`;
                }
            }

            // Always prevent default to stop Firefox touch handling
            e.preventDefault();
        }, { passive: false });

        lbImgWrap.addEventListener('touchend', e => {
            const diffX = touchCurrentX - touchStartX;
            const img = lbImgWrap.querySelector('img');

            lbImgWrap.classList.remove('swiping');

            if (isSwiping && Math.abs(diffX) > swipeThreshold) {
                // Complete the swipe - slide out and navigate
                if (img) {
                    const direction = diffX > 0 ? 1 : -1;
                    img.style.transition = 'transform 0.2s ease-out, opacity 0.2s ease-out';
                    // Use translate3d for Firefox compatibility
                    img.style.transform = `translate3d(${direction * window.innerWidth * 0.5}px, 0, 0)`;
                    img.style.opacity = '0';

                    setTimeout(() => {
                        if (diffX > 0) {
                            lbNav(-1, true); // Swipe right - previous
                        } else {
                            lbNav(1, true);  // Swipe left - next
                        }
                    }, 200);
                }
            } else if (isSwiping && img) {
                // Snap back - didn't swipe far enough
                lbImgWrap.classList.add('snap-back');
                img.style.transform = 'translate3d(0, 0, 0)';
                setTimeout(() => {
                    lbImgWrap.classList.remove('snap-back');
                }, 250);
            }

            isSwiping = false;
        }, { passive: true });
    </script>
</body>

</html>
