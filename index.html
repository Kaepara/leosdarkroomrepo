<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>leosdarkroom</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #fff;
            color: #111;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            font-size: 13px;
            font-weight: 400;
        }

        header {
            padding: 28px 32px 20px;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .site-name {
            font-size: 13px;
            font-weight: 400;
            letter-spacing: 0.02em;
            color: #111;
            text-decoration: none;
        }

        nav {
            display: flex;
            gap: 24px;
        }

        nav a {
            font-size: 12px;
            color: #999;
            text-decoration: none;
            letter-spacing: 0.02em;
            transition: color 0.15s;
        }

        nav a:hover {
            color: #111;
        }

        .filters {
            padding: 0 32px 24px;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .f-btn {
            font-size: 12px;
            color: #bbb;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            letter-spacing: 0.02em;
            transition: color 0.15s;
            font-family: inherit;
        }

        .f-btn:hover {
            color: #111;
        }

        .f-btn.active {
            color: #111;
        }

        /* ── SECTIONS ── */
        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* ── GRID ──
     3 columns, left-to-right placement.
     grid-auto-rows is tiny (4px) so JS can set exact row spans.
     row-gap is 0 — gap is baked into each item's span calculation. */
        .photo-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-auto-rows: 4px;
            column-gap: 20px;
            row-gap: 0;
            padding: 0 32px;
        }

        @media (max-width: 760px) {
            .photo-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .photo-grid {
                grid-template-columns: 1fr;
                padding: 0 16px;
            }
        }

        .grid-photo {
            cursor: zoom-in;
            overflow: hidden;
            background: #f2f2f2;
            opacity: 0;
            animation: fadein 0.25s forwards;
            /* Bottom margin provides the consistent gap between items */
            margin-bottom: 20px;
            border-radius: 10px;
        }

        .grid-photo img,
        .grid-photo canvas {
            display: block;
            width: 100%;
            height: auto;
            transition: transform 0.2s;
        }

        .grid-photo:hover img,
        .grid-photo:hover canvas {
            transform: scale(1.05);
        }

        /* ── ULTRAWIDE STRIP ── */
        .uw-strip {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 0 32px;
        }

        .uw-item {
            cursor: zoom-in;
            overflow: hidden;
            background: #f2f2f2;
            opacity: 0;
            animation: fadein 0.25s forwards;
            border-radius: 10px;
        }

        .uw-item img,
        .uw-item canvas {
            display: block;
            width: 100%;
            height: auto;
            transition: transform 0.2s;
        }

        .uw-item:hover img,
        .uw-item:hover canvas {
            transform: scale(1.05);
        }

        @keyframes fadein {
            to {
                opacity: 1;
            }
        }

        /* ── LIGHTBOX ── */
        .lb {
            position: fixed;
            inset: 0;
            background: #fff;
            z-index: 999;
            display: flex;
            flex-direction: column;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .lb.open {
            opacity: 1;
            pointer-events: all;
        }

        .lb-img-wrap {
            flex: 1;
            min-height: 0;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: default;
        }

        .lb-img-wrap.zoomed {
            overflow: hidden;
        }

        /* Fixed consistent box — every image lives inside this regardless of resolution.
     Landscape fills width, portrait fills height. Both constrained equally. */
        .lb-img-wrap img,
        .lb-img-wrap canvas {
            display: block;
            max-width: calc(100vw - 160px);
            max-height: calc(100vh - 44px - 48px);
            width: auto;
            height: auto;
            pointer-events: auto;
            user-select: none;
            cursor: zoom-in;
        }

        .lb-img-wrap.zoomed img,
        .lb-img-wrap.zoomed canvas {
            cursor: grab;
        }

        .lb-img-wrap.zoomed.dragging img,
        .lb-img-wrap.zoomed.dragging canvas {
            cursor: grabbing;
        }

        .lb-bar {
            width: 100%;
            height: 44px;
            border-top: 1px solid #eee;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 32px;
            flex-shrink: 0;
        }

        .lb-info {
            font-size: 11px;
            color: #aaa;
            letter-spacing: 0.03em;
        }

        .lb-btn {
            font-size: 11px;
            color: #aaa;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            font-family: inherit;
            letter-spacing: 0.03em;
            transition: color 0.15s;
        }

        .lb-btn:hover {
            color: #111;
        }

        .lb-arrow {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 20px;
            color: #ccc;
            font-size: 20px;
            line-height: 1;
            transition: color 0.15s;
            z-index: 1;
            user-select: none;
        }

        .lb-arrow:hover {
            color: #111;
        }

        .lb-arrow-left {
            left: 4px;
        }

        .lb-arrow-right {
            right: 4px;
        }

        footer {
            padding: 32px 32px 24px;
            margin-top: 32px;
            border-top: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }

        footer p {
            font-size: 11px;
            color: #ccc;
            letter-spacing: 0.03em;
        }
    </style>
</head>

<body>

    <header>
        <a class="site-name" href="#">leosdarkroom</a>
    </header>

    <div class="filters" id="filterBar"></div>
    <div id="sectionsWrap"></div>

    <div class="lb" id="lb">
        <div class="lb-img-wrap" id="lbImgWrap">
            <button class="lb-arrow lb-arrow-left" id="lbPrev">&#8592;</button>
            <button class="lb-arrow lb-arrow-right" id="lbNext">&#8594;</button>
        </div>
        <div class="lb-bar">
            <span class="lb-info" id="lbInfo"></span>
            <div><button class="lb-btn" id="lbClose">close</button></div>
        </div>
    </div>

    <footer>
        <p>leo ashcroft</p>
        <p>auckland, nz</p>
    </footer>

    <script>
        // ============================================================
        //  PORTFOLIO CONFIG — edit this to customise your portfolio
        //
        //  HOW TO ADD YOUR OWN IMAGES:
        //  1. Put your image files in the same folder as this HTML file
        //  2. Set  src: 'your-filename.jpg'  for each photo
        //
        //  HOW TO ADD A NEW SECTION:
        //  Copy one of the section objects below and add it to the
        //  SECTIONS array. Set  layout: 'grid'  for normal photos,
        //  or  layout: 'ultrawide'  for 65:24 panoramic images.
        //
        //  PHOTO FIELDS (all optional except src and title):
        //    src:    filename (e.g. 'my-photo.jpg')
        //    title:  caption shown in lightbox
        //    film:   film stock — omit if shooting digital
        //    camera: camera body — omit to hide
        //    lens:   lens used — omit to hide
        // ============================================================

        const SECTIONS = [
            {
                id: 'all',
                label: 'all',
                layout: 'grid',
                photos: [
                    { src: 'me.jpg', title: 'testing', film: 'hp5+' },
                    { title: 'untitled #02', film: 'tri-x', seed: 14, w: 3, h: 4 },
                    { title: 'untitled #03', film: 'hp5+', seed: 21, w: 16, h: 9 },
                    { title: 'untitled #04', film: 'fomapan', seed: 28, w: 3, h: 4 },
                    { title: 'untitled #05', film: 'hp5+', seed: 35, w: 3, h: 2 },
                    { title: 'untitled #06', film: 'delta 400', seed: 42, w: 16, h: 9 },
                    { title: 'untitled #07', film: 'tri-x', seed: 49, w: 3, h: 4 },
                    { title: 'untitled #08', film: 'hp5+', seed: 56, w: 3, h: 2 },
                    { title: 'untitled #09', film: 'fomapan', seed: 63, w: 3, h: 4 },
                    { title: 'untitled #10', film: 'hp5+', seed: 70, w: 16, h: 9 },
                    { title: 'untitled #11', film: 'tri-x', seed: 77, w: 3, h: 4 },
                    { title: 'untitled #12', film: 'delta 400', seed: 84, w: 3, h: 2 },
                ]
            },
            {
                id: 'film',
                label: 'film',
                layout: 'grid',
                photos: [
                    { title: 'untitled #01', film: 'hp5+', seed: 7, w: 4, h: 3 },
                    { title: 'untitled #02', film: 'tri-x', seed: 14, w: 3, h: 4 },
                    { title: 'untitled #03', film: 'hp5+', seed: 35, w: 3, h: 2 },
                    { title: 'untitled #04', film: 'fomapan', seed: 63, w: 3, h: 4 },
                ]
            },
            {
                id: 'digital',
                label: 'digital',
                layout: 'grid',
                photos: [
                    { title: 'untitled #01', seed: 21, w: 16, h: 9 },
                    { title: 'untitled #02', seed: 42, w: 16, h: 9 },
                    { title: 'untitled #03', seed: 70, w: 3, h: 4 },
                    { title: 'untitled #04', seed: 84, w: 3, h: 2 },
                ]
            },
            {
                id: 'ultrawide',
                label: 'ultrawide',
                layout: 'ultrawide',
                photos: [
                    { src: 'P1054011.JPEG', title: 'vero building' },
                    { title: 'panorama #02', film: 'tri-x', seed: 202 },
                    { title: 'panorama #03', film: 'delta 400', seed: 203 },
                    { title: 'panorama #04', film: 'hp5+', seed: 204 },
                    { title: 'panorama #05', film: 'fomapan', seed: 205 },
                ]
            },
        ];

        // ============================================================
        //  END OF CONFIG — no need to edit below this line
        // ============================================================

        function rng(seed) {
            let s = seed;
            return () => { s = (s * 16807) % 2147483647; return (s - 1) / 2147483646; };
        }

        function renderPlaceholder(canvas, w, h, seed) {
            const PW = w * 140, PH = h * 140;
            canvas.width = PW; canvas.height = PH;
            const ctx = canvas.getContext('2d');
            const r = rng(seed * 31337);
            const sceneType = Math.floor(r() * 5);
            const grad = ctx.createLinearGradient(0, 0, 0, PH);
            if (sceneType === 0) { grad.addColorStop(0, `hsl(0,0%,${82 + r() * 10}%)`); grad.addColorStop(0.4, `hsl(0,0%,${65 + r() * 12}%)`); grad.addColorStop(1, `hsl(0,0%,${25 + r() * 20}%)`); }
            else if (sceneType === 1) { grad.addColorStop(0, `hsl(0,0%,${8 + r() * 12}%)`); grad.addColorStop(0.5, `hsl(0,0%,${18 + r() * 20}%)`); grad.addColorStop(1, `hsl(0,0%,${35 + r() * 20}%)`); }
            else if (sceneType === 2) { grad.addColorStop(0, `hsl(0,0%,${88 + r() * 8}%)`); grad.addColorStop(0.35, `hsl(0,0%,${50 + r() * 18}%)`); grad.addColorStop(1, `hsl(0,0%,${5 + r() * 15}%)`); }
            else if (sceneType === 3) { grad.addColorStop(0, `hsl(0,0%,${58 + r() * 18}%)`); grad.addColorStop(1, `hsl(0,0%,${40 + r() * 18}%)`); }
            else { grad.addColorStop(0, `hsl(0,0%,${78 + r() * 18}%)`); grad.addColorStop(0.42, `hsl(0,0%,${88 + r() * 8}%)`); grad.addColorStop(0.58, `hsl(0,0%,${12 + r() * 14}%)`); grad.addColorStop(1, `hsl(0,0%,${4 + r() * 10}%)`); }
            ctx.fillStyle = grad; ctx.fillRect(0, 0, PW, PH);
            for (let i = 0; i < 4 + Math.floor(r() * 7); i++) {
                const type = r(); ctx.fillStyle = `hsl(0,0%,${5 + r() * 85}%)`; ctx.globalAlpha = 0.35 + r() * 0.55;
                if (type < 0.3) { ctx.fillRect(r() * PW, PH * 0.25 + r() * PH * 0.55, 8 + r() * PW * 0.22, 18 + r() * PH * 0.55); }
                else if (type < 0.5) { ctx.fillRect(0, PH * 0.3 + r() * PH * 0.45, PW, 1 + r() * 25); }
                else if (type < 0.68) { ctx.beginPath(); ctx.arc(r() * PW, r() * PH * 0.7, 4 + r() * 35, 0, Math.PI * 2); ctx.fill(); }
                else { ctx.fillRect(r() * PW, PH * 0.15 + r() * PH * 0.35, 1 + r() * 7, PH * 0.25 + r() * PH * 0.55); }
            }
            ctx.globalAlpha = 1;
            if (r() > 0.55) { const s = r() < 0.5 ? 0 : PW; const llG = ctx.createRadialGradient(s, PH * r() * 0.5, 0, s, PH * 0.5, PW * 0.9); llG.addColorStop(0, `hsla(0,0%,${80 + r() * 15}%,0.18)`); llG.addColorStop(1, 'hsla(0,0%,100%,0)'); ctx.fillStyle = llG; ctx.fillRect(0, 0, PW, PH); }
            const id = ctx.getImageData(0, 0, PW, PH); const d = id.data; const gr = rng(seed);
            for (let i = 0; i < d.length; i += 4) { const n = (gr() - 0.5) * 60; d[i] = Math.min(255, Math.max(0, d[i] + n)); d[i + 1] = Math.min(255, Math.max(0, d[i + 1] + n)); d[i + 2] = Math.min(255, Math.max(0, d[i + 2] + n)); }
            ctx.putImageData(id, 0, 0);
            const vig = ctx.createRadialGradient(PW / 2, PH / 2, PH * 0.2, PW / 2, PH / 2, PH * 0.9); vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,0.35)'); ctx.fillStyle = vig; ctx.fillRect(0, 0, PW, PH);
        }

        function renderUwide(canvas, seed) {
            const PW = 1300, PH = 480;
            canvas.width = PW; canvas.height = PH;
            const ctx = canvas.getContext('2d');
            const r = rng(seed * 31337);
            const sceneType = Math.floor(r() * 5);
            const grad = ctx.createLinearGradient(0, 0, PW, 0);
            if (sceneType === 0) { grad.addColorStop(0, `hsl(0,0%,${20 + r() * 15}%)`); grad.addColorStop(0.3, `hsl(0,0%,${60 + r() * 20}%)`); grad.addColorStop(0.7, `hsl(0,0%,${75 + r() * 15}%)`); grad.addColorStop(1, `hsl(0,0%,${30 + r() * 20}%)`); }
            else if (sceneType === 1) { grad.addColorStop(0, `hsl(0,0%,${5 + r() * 10}%)`); grad.addColorStop(0.5, `hsl(0,0%,${25 + r() * 20}%)`); grad.addColorStop(1, `hsl(0,0%,${10 + r() * 15}%)`); }
            else if (sceneType === 2) { grad.addColorStop(0, `hsl(0,0%,${80 + r() * 15}%)`); grad.addColorStop(0.4, `hsl(0,0%,${40 + r() * 20}%)`); grad.addColorStop(1, `hsl(0,0%,${85 + r() * 10}%)`); }
            else if (sceneType === 3) { grad.addColorStop(0, `hsl(0,0%,${55 + r() * 20}%)`); grad.addColorStop(1, `hsl(0,0%,${40 + r() * 20}%)`); }
            else { grad.addColorStop(0, `hsl(0,0%,${70 + r() * 20}%)`); grad.addColorStop(0.5, `hsl(0,0%,${88 + r() * 8}%)`); grad.addColorStop(1, `hsl(0,0%,${15 + r() * 20}%)`); }
            ctx.fillStyle = grad; ctx.fillRect(0, 0, PW, PH);
            const hy = PH * (0.4 + r() * 0.3);
            for (let i = 0; i < 4 + Math.floor(r() * 8); i++) {
                const type = r(); ctx.fillStyle = `hsl(0,0%,${5 + r() * 85}%)`; ctx.globalAlpha = 0.3 + r() * 0.5;
                if (type < 0.4) { ctx.fillRect(r() * PW, hy - r() * PH * 0.5, 4 + r() * PW * 0.06, r() * PH * 0.6); }
                else if (type < 0.7) { ctx.fillRect(0, hy + (r() - 0.5) * 40, PW, 1 + r() * 20); }
                else { ctx.beginPath(); ctx.arc(r() * PW, r() * PH, 5 + r() * 30, 0, Math.PI * 2); ctx.fill(); }
            }
            ctx.globalAlpha = 1;
            const vig = ctx.createRadialGradient(PW / 2, PH / 2, PH * 0.1, PW / 2, PH / 2, PW * 0.6); vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(0,0,0,0.4)'); ctx.fillStyle = vig; ctx.fillRect(0, 0, PW, PH);
        }

        function makeEl(photo, isUltrawide, forLightbox) {
            if (photo.src) {
                const img = document.createElement('img');
                img.src = photo.src;
                img.alt = photo.title;
                if (!forLightbox) img.loading = 'lazy';
                return img;
            }
            const c = document.createElement('canvas');
            if (isUltrawide) renderUwide(c, photo.seed);
            else renderPlaceholder(c, photo.w, photo.h, photo.seed);
            return c;
        }

        // ── Render sections and filter tabs ──
        const filterBar = document.getElementById('filterBar');
        const sectionsWrap = document.getElementById('sectionsWrap');

        function buildSection(sec) {
            const secEl = document.createElement('div');
            secEl.className = 'section' + (SECTIONS.indexOf(sec) === 0 ? ' active' : '');
            secEl.id = 'sec-' + sec.id;

            const isUw = sec.layout === 'ultrawide';
            const listEl = document.createElement('div');
            listEl.className = isUw ? 'uw-strip' : 'photo-grid';

            sec.photos.forEach((photo, pi) => {
                const item = document.createElement('div');
                item.className = isUw ? 'uw-item' : 'grid-photo';
                item.style.animationDelay = `${pi * 0.04}s`;
                item.appendChild(makeEl(photo, isUw, false));
                item.addEventListener('click', () => openLb(sec.id, pi));
                listEl.appendChild(item);
            });

            secEl.appendChild(listEl);
            return secEl;
        }

        SECTIONS.forEach((sec, si) => {
            const btn = document.createElement('button');
            btn.className = 'f-btn' + (si === 0 ? ' active' : '');
            btn.textContent = sec.label;
            btn.dataset.id = sec.id;
            filterBar.appendChild(btn);
            sectionsWrap.appendChild(buildSection(sec));
        });

        // ── Filter switching ──
        filterBar.addEventListener('click', e => {
            const btn = e.target.closest('.f-btn');
            if (!btn) return;
            document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById('sec-' + btn.dataset.id).classList.add('active');
        });

        // ── Row-span masonry ──
        // grid-auto-rows: 4px, row-gap: 0. Each item uses margin-bottom: 20px for gap.
        // Span = ceil(imageHeight / 4) + ceil(20 / 4) to include the margin in the span.
        function spanItem(item) {
            const img = item.querySelector('img, canvas');
            if (!img) return;
            const colW = item.getBoundingClientRect().width;
            if (!colW) return;
            let h;
            if (img.tagName === 'CANVAS') {
                h = colW * (img.height / img.width);
            } else {
                if (!img.naturalWidth) return;
                h = colW * (img.naturalHeight / img.naturalWidth);
            }
            // Each row unit is 4px. We need to span enough rows to cover image + 20px margin.
            item.style.gridRowEnd = `span ${Math.ceil((h + 20) / 4)}`;
        }

        function spanAll() {
            document.querySelectorAll('.photo-grid .grid-photo').forEach(spanItem);
        }

        window.addEventListener('load', spanAll);
        window.addEventListener('resize', spanAll);
        document.addEventListener('load', e => {
            if (e.target.tagName === 'IMG') {
                const item = e.target.closest('.grid-photo');
                if (item) spanItem(item);
            }
        }, true);
        setTimeout(spanAll, 50);

        // ── Lightbox ──
        const lb = document.getElementById('lb');
        const lbImgWrap = document.getElementById('lbImgWrap');
        const lbInfo = document.getElementById('lbInfo');
        let lbSecId = null;
        let lbIndex = 0;

        // Zoom state
        let lbZoomLevel = 1;
        let lbPanX = 0;
        let lbPanY = 0;
        let lbIsDragging = false;
        let lbDragStartX = 0;
        let lbDragStartY = 0;
        let lbDragMoved = false; // Track if the mouse actually moved during drag

        function currentSec() { return SECTIONS.find(s => s.id === lbSecId); }

        function updateLbTransform() {
            const img = lbImgWrap.querySelector('img, canvas');
            if (!img) return;
            img.style.transform = `scale(${lbZoomLevel}) translate(${lbPanX}px, ${lbPanY}px)`;
            img.style.transformOrigin = 'center center';
            img.style.transition = lbIsDragging ? 'none' : 'transform 0.2s';
        }

        function resetLbZoom() {
            lbZoomLevel = 1;
            lbPanX = 0;
            lbPanY = 0;
            lbImgWrap.classList.remove('zoomed');
            updateLbTransform();
        }

        function openLb(secId, index) {
            lbSecId = secId;
            lbIndex = index;
            drawLb();
            lb.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function drawLb() {
            const sec = currentSec();
            const photo = sec.photos[lbIndex];
            const isUw = sec.layout === 'ultrawide';
            // Remove old image, keep arrow buttons
            lbImgWrap.querySelectorAll('img, canvas').forEach(el => el.remove());
            // Insert image before arrows so it sits behind them in stacking
            const el = makeEl(photo, isUw, true);
            lbImgWrap.insertBefore(el, lbImgWrap.firstChild);
            const meta = [photo.camera, photo.lens, photo.film].filter(Boolean).join(' · ');
            const counter = `${lbIndex + 1} / ${sec.photos.length}`;
            lbInfo.textContent = meta
                ? `${photo.title} — ${meta}   ${counter}`
                : `${photo.title}   ${counter}`;
            resetLbZoom();
        }

        function closeLb() {
            resetLbZoom();
            lb.classList.remove('open');
            document.body.style.overflow = '';
        }

        function lbNav(dir) {
            const sec = currentSec();
            lbIndex = (lbIndex + dir + sec.photos.length) % sec.photos.length;
            drawLb();
        }

        document.getElementById('lbClose').addEventListener('click', e => { e.stopPropagation(); closeLb(); });
        document.getElementById('lbPrev').addEventListener('click', e => { e.stopPropagation(); lbNav(-1); });
        document.getElementById('lbNext').addEventListener('click', e => { e.stopPropagation(); lbNav(1); });

        // Click on image to zoom in/out
        lbImgWrap.addEventListener('click', e => {
            const clickedOnImage = e.target.tagName === 'IMG' || e.target.tagName === 'CANVAS';

            if (clickedOnImage) {
                // If we just finished a drag, don't trigger zoom toggle
                if (lbDragMoved) return;

                // Clicked on image - toggle zoom
                if (lbZoomLevel > 1) {
                    resetLbZoom();
                } else {
                    lbZoomLevel = 1.5;
                    lbImgWrap.classList.add('zoomed');
                    updateLbTransform();
                }
            } else if (!e.target.closest('.lb-arrow')) {
                // Clicked on white space (not arrow, not image) - close lightbox
                // Always allow closing, even after a drag
                closeLb();
            }
        });

        // Zoom and pan controls
        lbImgWrap.addEventListener('wheel', e => {
            if (!lb.classList.contains('open')) return;
            e.preventDefault();
            const zoomDelta = e.deltaY > 0 ? -0.1 : 0.1;
            lbZoomLevel = Math.max(1.5, Math.min(3, lbZoomLevel + zoomDelta));
            updateLbTransform();
        }, { passive: false });

        lbImgWrap.addEventListener('mousedown', e => {
            if (lbZoomLevel <= 1) return;
            lbIsDragging = true;
            lbDragMoved = false; // Reset the drag moved flag
            lbDragStartX = e.clientX - lbPanX;
            lbDragStartY = e.clientY - lbPanY;
            lbImgWrap.classList.add('dragging');
            e.preventDefault(); // Prevent text selection
        });

        document.addEventListener('mousemove', e => {
            if (!lbIsDragging) return;
            const newPanX = e.clientX - lbDragStartX;
            const newPanY = e.clientY - lbDragStartY;

            // Check if we actually moved (threshold of 3px to distinguish from clicks)
            if (Math.abs(newPanX - lbPanX) > 3 || Math.abs(newPanY - lbPanY) > 3) {
                lbDragMoved = true;
            }

            lbPanX = newPanX;
            lbPanY = newPanY;
            updateLbTransform();
        });

        document.addEventListener('mouseup', () => {
            if (lbIsDragging) {
                lbIsDragging = false;
                lbImgWrap.classList.remove('dragging');

                // Reset lbDragMoved after a short delay to allow click handler to check it
                setTimeout(() => {
                    lbDragMoved = false;
                }, 10);
            }
        });

        document.addEventListener('keydown', e => {
            if (!lb.classList.contains('open')) return;
            if (e.key === 'Escape') closeLb();
            if (e.key === 'ArrowLeft') lbNav(-1);
            if (e.key === 'ArrowRight') lbNav(1);
        });
    </script>
</body>

</html>
